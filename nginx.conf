server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Basic, non-breaking security headers.
    # A stricter CSP is intentionally deferred to a later hardening pass.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Vite emits hashed, content-addressed filenames under /assets/ — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html (prerendered Home) and the SPA fallback shell must always be
    # revalidated so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /__spa-fallback.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router Framework Mode (ssr:false + prerender) ships one static
    # index.html per prerendered route (/, /shop, /lima-2026, ...) plus a
    # separate, content-less __spa-fallback.html for routes that were NOT
    # prerendered (dynamic :slug routes today).
    #
    # $uri/index.html (an explicit file, not $uri/) serves a prerendered
    # route's own HTML directly. Using $uri/ instead would make nginx treat it
    # as a directory match and 301-redirect to add a trailing slash before
    # serving it — which would make the visited URL (e.g. /lima-2026/) diverge
    # from the canonical tag baked into that HTML (/lima-2026), a self-inflicted
    # SEO/redirect chain. Anything that isn't a real file or a prerendered
    # route's index.html — including every dynamic route — falls back to
    # __spa-fallback.html, NOT index.html, so a request like
    # /product/oversized-tee-ot7 never receives the Home page's prerendered
    # title/canonical/content as its initial HTML.
    location / {
        try_files $uri $uri/index.html /__spa-fallback.html;
    }
}
