server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Basic, non-breaking security headers.
    # A stricter CSP is intentionally deferred to a later hardening pass.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Vite emits hashed, content-addressed filenames under /assets/ — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router: let the client-side router resolve any unknown path
    # (e.g. /members/jimin, /product/oversized-tee-ot7) instead of a Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
